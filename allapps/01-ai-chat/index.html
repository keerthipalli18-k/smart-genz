<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova AI Chat</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header class="topbar"><div class="logo">Nova<span>AI</span></div><div><span class="pill">AI Chat</span></div></header>
<main class="container"><div class="chat card"><div class="chathead"><div><h2>Project Copilot</h2><p class="muted">Ask questions, brainstorm, or analyze ideas.</p></div><button class="btn secondary" id="clear">Clear</button></div>
<div id="messages" class="messages"><div class="msg ai"><b>Nova AI</b><p>Hi! I’m ready to help. What are you working on today?</p></div></div>
<div class="composer"><textarea id="input" rows="2" placeholder="Message Nova AI..."></textarea><button class="btn" id="send">Send ↗</button></div></div></main></div><script src="script.js"></script></body></html>
