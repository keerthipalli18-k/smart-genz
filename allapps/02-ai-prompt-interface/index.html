<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Studio</title><link rel="stylesheet" href="style.css"></head>
<body><header class="topbar"><div class="logo">Prompt<span>Studio</span></div><span class="pill">AI Prompt Interface</span></header><main class="container"><section class="hero"><p class="eyebrow">PROMPT WORKSPACE</p><h1>Turn ideas into <span>better prompts.</span></h1><p class="muted">Build, refine and test instructions before sending them to an AI model.</p></section>
<div class="grid two"><section class="card panel"><div class="row"><h3>Prompt</h3><button class="btn secondary" id="sample">Use sample</button></div><textarea id="prompt" placeholder="Describe what you want the AI to do..."></textarea><div class="chips"><button data-t="Act as a UX designer">UX designer</button><button data-t="Summarize this for a student">Summarize</button><button data-t="Generate 5 creative ideas">Ideas</button></div><button class="btn full" id="run">Run prompt →</button></section>
<section class="card panel"><h3>Preview</h3><div id="preview" class="preview"><span class="muted">Your prompt preview will appear here.</span></div><div class="metrics"><div><b>0</b><span>Words</span></div><div><b>0</b><span>Chars</span></div><div><b>Ready</b><span>Status</span></div></div></section></div></main><script src="script.js"></script></body></html>
