<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVerse - Movie Discovery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎬 CineVerse</h1>
  <nav><a href="#">Home</a><a href="#movies">Movies</a><a href="#favorites">Favorites</a></nav>
  <input id="search" type="text" placeholder="Search movies...">
</header>
<section class="hero">
  <p>MOVIE DISCOVERY</p>
  <h2>Find Your Next<br>Favorite Movie</h2>
  <p>Explore trending movies, popular genres and hidden gems.</p>
  <button onclick="scrollMovies()">Explore Movies</button>
</section>
<section id="movies" class="section">
  <h2>Popular Movies</h2>
  <div class="filters">
    <button onclick="filterMovies('All')">All</button>
    <button onclick="filterMovies('Action')">Action</button>
    <button onclick="filterMovies('Drama')">Drama</button>
    <button onclick="filterMovies('Comedy')">Comedy</button>
  </div>
  <div id="movieContainer" class="grid"></div>
</section>
<div id="modal" class="modal"><div class="modal-box"><span onclick="closeModal()">×</span><h2 id="modalTitle"></h2><p id="modalDescription"></p></div></div>
<script src="script.js"></script>
</body>
</html>
